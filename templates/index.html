<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Lead Gen Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 2rem; background-color: #f8f9fa; }
        .container { max-width: 1000px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">🏫 School Lead Generation Tool</h1>
        
        <div class="card p-4 mb-4">
            <form id="searchForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Platform</label>
                        <select class="form-select" id="platform" required>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Instagram">Instagram</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">City</label>
                        <select class="form-select" id="city" required>
                            {% for city in cities %}
                            <option value="{{ city }}">{{ city }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Keywords</label>
                        <input type="text" class="form-control" id="keywords" value="admissions">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Results (Max 100)</label>
                        <input type="number" class="form-control" id="num_results" value="100" min="10" max="100">
                    </div>
                </div>
                <div class="mt-4 text-center">
                    <button type="submit" class="btn btn-primary px-5" id="searchBtn">Find Leads</button>
                </div>
            </form>
        </div>

        <div id="loading" class="text-center my-5" style="display: none;">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Fetching up to 100 leads for you...</p>
        </div>

        <div id="resultsArea" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 id="resultCount">Results</h3>
                <button class="btn btn-success" id="downloadBtn">Download CSV</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered bg-white" id="resultsTable">
                    <thead class="table-dark">
                        <tr>
                            <th>Title</th>
                            <th>URL</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="error" class="alert alert-danger" style="display: none;"></div>
    </div>

    <script>
        let currentResults = [];

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const platform = document.getElementById('platform').value;
            const city = document.getElementById('city').value;
            const keywords = document.getElementById('keywords').value;
            const num_results = document.getElementById('num_results').value;

            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('searchBtn').disabled = true;

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ platform, city, keywords, num_results })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Search failed');

                currentResults = data.results;
                const tbody = document.querySelector('#resultsTable tbody');
                tbody.innerHTML = '';
                
                currentResults.forEach(res => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${res.Title}</td><td><a href="${res.URL}" target="_blank">View Profile</a></td><td>${res.Description}</td>`;
                    tbody.appendChild(tr);
                });

                document.getElementById('resultCount').innerText = `Found ${currentResults.length} Leads`;
                document.getElementById('resultsArea').style.display = 'block';
            } catch (err) {
                const errDiv = document.getElementById('error');
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchBtn').disabled = false;
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            const headers = ['Title', 'URL', 'Description'];
            const csv = [headers.join(','), ...currentResults.map(r => headers.map(h => `"${(r[h] || '').toString().replace(/"/g, '""')}"`).join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ready4exam_leads.csv';
            a.click();
        });
    </script>
</body>
</html>
