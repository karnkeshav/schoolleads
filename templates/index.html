<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Lead Gen Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 2rem; }
        .container { max-width: 900px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">🏫 School Lead Generation Tool</h1>
        <p class="text-center text-muted">Use Google X-Ray Search to find school leads in Tier 3 Indian cities.</p>

        <div class="card p-4 mb-4">
            <form id="searchForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="platform" class="form-label">Platform</label>
                        <select class="form-select" id="platform" required>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Instagram">Instagram</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="city" class="form-label">City</label>
                        <select class="form-select" id="city" required>
                            {% for city in cities %}
                            <option value="{{ city }}">{{ city }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="keywords" class="form-label">Keywords</label>
                        <input type="text" class="form-control" id="keywords" value="admissions">
                    </div>
                </div>
                <div class="mt-3 text-center">
                    <button type="submit" class="btn btn-primary" id="searchBtn">Find Leads</button>
                </div>
            </form>
        </div>

        <div id="resultsArea" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Results</h3>
                <button class="btn btn-success" id="downloadBtn">Download CSV</button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-bordered" id="resultsTable">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>URL</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="loading" class="text-center" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Searching...</p>
        </div>

        <div id="error" class="alert alert-danger" style="display: none;"></div>
    </div>

    <script>
        let currentResults = [];

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const platform = document.getElementById('platform').value;
            const city = document.getElementById('city').value;
            const keywords = document.getElementById('keywords').value;

            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('searchBtn').disabled = true;

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ platform, city, keywords })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'An error occurred');
                }

                currentResults = data.results;
                renderTable(currentResults);

                if (currentResults.length > 0) {
                    document.getElementById('resultsArea').style.display = 'block';
                } else {
                    showError('No results found.');
                }

            } catch (err) {
                showError(err.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchBtn').disabled = false;
            }
        });

        function renderTable(results) {
            const tbody = document.querySelector('#resultsTable tbody');
            tbody.innerHTML = '';

            results.forEach(result => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${result.Title || ''}</td>
                    <td><a href="${result.URL}" target="_blank">${result.URL || ''}</a></td>
                    <td>${result.Description || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        }

        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (!currentResults.length) return;

            const headers = ['Title', 'URL', 'Description'];
            const csvRows = [headers.join(',')];

            currentResults.forEach(row => {
                const values = headers.map(header => {
                    const val = row[header] ? row[header].toString().replace(/"/g, '""') : '';
                    return `"${val}"`;
                });
                csvRows.push(values.join(','));
            });

            const csvContent = csvRows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'leads_ready4exam.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
